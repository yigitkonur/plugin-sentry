version = 1
requires-python = ">=3.12"

[[package]]
name = "celery"
version = "5.4.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "django"
version = "5.1.4"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "psycopg"
version = "3.2.3"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "sentry-sdk"
version = "2.72.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "django-celery"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "celery" },
    { name = "django" },
    { name = "psycopg" },
    { name = "sentry-sdk" },
]
