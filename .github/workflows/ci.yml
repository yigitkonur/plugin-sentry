name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: show the release decision, change nothing
        type: boolean
        default: true
  schedule:
    - cron: "17 5 * * 1"   # weekly: docs drift (links, identifiers, stale-API rows)
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Claude Code (plugin validator)
        run: npm install -g @anthropic-ai/claude-code
      - name: Offline checks (compile, fixtures, validate, secrets)
        run: scripts/check.sh --offline
      - name: Docs-backed checks (identifiers, stale-API rows, links)
        run: scripts/check.sh
  # After the checks pass on main: bump the version of every plugin whose files changed, tag it and publish a release.
  # Installed copies update on a version change (marketplaces with autoUpdate on), so a shipped change with no bump would never reach them.
  # Run it by hand with dry_run to see the decision without releasing anything.
  release:
    needs: check
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release)') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide the bump
        id: bump
        run: python3 scripts/bump-version.py --github-output
      - name: Write, commit, tag, release
        if: steps.bump.outputs.count != '0' && env.DRY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.bump.outputs.releases }}
        run: |
          python3 scripts/bump-version.py --write > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $(echo "$RELEASES" | awk '{print $4}' | paste -sd' ' -) [skip ci]"
          git push origin HEAD:main
          echo "$RELEASES" | while read -r name old new tag level n base; do
            prev="$(git tag --list "${tag%%v[0-9]*}v[0-9]*" --sort=-v:refname | head -1)"
            git tag -a "$tag" -m "$name $new"
            git push origin "$tag"
            range="${prev:+$prev..}HEAD~1"
            git log "$range" --no-merges --format='- %s' -- "$base" | grep -v '^- chore(release)' > "$RUNNER_TEMP/notes.md" || true
            [ -s "$RUNNER_TEMP/notes.md" ] || echo "- $level release" > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" --title "$name $new" --notes-file "$RUNNER_TEMP/notes.md"
          done
